notes: |
  This record replaces the provisional `equinix-ct2-cape-town` identity. The source
  does not give official Equinix facility codes for the two proposed Cape Town sites.

  Daily Maverick reports that the two proposed Equinix data centres are next to Cape
  Town International Airport, on the old King David Golf Club course, and together
