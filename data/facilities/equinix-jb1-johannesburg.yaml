notes: |
  Equinix JB1 (formerly Teraco JB1) is the flagship facility on Africa's largest carrier-neutral
  colocation campus, located in the Isando industrial zone of Ekurhuleni municipality, east of
  the Johannesburg CBD.

  Equinix completed its acquisition of Teraco Data Environments in June 2022 for approximately
  USD 1.625 billion (ZAR ~26.9 billion), marking Equinix's entry onto the African continent.
  The deal included five campuses: three in Johannesburg (JB1, JB2, JB3), one in Cape Town (CT1),
  and one in Port Elizabeth (PE1).

  JB1 hosts the Johannesburg Internet Exchange (JINX) and serves as the primary hyperscaler
  on-ramp for sub-Saharan Africa, with direct interconnects to AWS, Microsoft Azure, and
  Google Cloud on-premises.

