notes: |
  This record is distinct from Teraco's Isando campus. Earlier tracking conflated an
  Equinix/JB1 record with Teraco JB1/JB3 material. Equinix's official Johannesburg
  market facility is JN1, opened in Germiston on 2024-10-24.

  Equinix states that JN1 has over 20,000 square feet (1,900+ square meters) of
  colocation space in its initial phase and plans to expand to more than 100,000
  square feet (9,515 square meters) at full build-out. Cabinet counts are disclosed
  by Equinix, but the current schema has no cabinet-count field.
