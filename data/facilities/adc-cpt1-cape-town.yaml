notes: |
  Africa Data Centres (ADC) CPT1 is the Cape Town campus of ADC, a subsidiary of Cassava
  Technologies (chairman: Strive Masiyiwa, CEO: Adil El Youssefi).

  Cassava is an NVIDIA Cloud Partner (NCP), deploying NVIDIA accelerated computing platforms
  and AI software using NCP reference architectures. The SA deployment was targeted by June 2025.
  This formally designates ADC facilities as capable of AI model training — not just inference —
  making CPT1 one of the very few facilities in Africa with confirmed training workloads.

  Cassava markets this as "Africa's first AI Factory", providing AI as a Service (AIaaS) to
  businesses, governments, and researchers across the continent.

  ADC also announced deals with Google and OpenAI at the Africa Tech Festival 2025.

  Stanlib Infrastructure Fund II (a South African institutional investor, co-head: Andy Louw)
  acquired a major stake in ADC's South African operations, approved approximately end-January
  2026. This introduces domestic institutional capital into what had been a foreign-owned
  infrastructure play.

  ADC operates a 12MW solar farm near Bloemfontein in partnership with Distributed Power Africa,
  feeding into the South African portfolio under wheeling arrangements.

  A 6MW expansion of this site was noted in the UCT source. Existing operational capacity is not
  stated — the 6MW in the capacity field refers to the expansion only.

  **Source URL s2:** The Cassava press release URL is a placeholder — replace with the actual URL.
