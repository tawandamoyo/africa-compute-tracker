notes: |
  Africa Data Centres (ADC) Midrand is the Gauteng campus of ADC, a subsidiary of Cassava
  Technologies (chairman: Strive Masiyiwa, CEO: Adil El Youssefi). Located on Old Pretoria Road
  in Midrand, it sits in the same corridor as the Vantage Data Centers Waterfall City facility.

  Cassava is an NVIDIA Cloud Partner (NCP), deploying NVIDIA accelerated computing platforms
  and AI software using NCP reference architectures. The SA deployment was targeted by June 2025.
  This formally confirms AI model training capability — not just inference — at ADC's South
  African facilities.

  The Midrand campus is served by the Eskom grid. ADC uses wheeling arrangements via a 12MW
  solar farm near Bloemfontein (with Distributed Power Africa) to offset grid consumption
  across its South African portfolio.

  Stanlib Infrastructure Fund II (co-head: Andy Louw) acquired a major stake in ADC's South
  African operations in approximately January 2026, introducing domestic institutional capital
  into what had been a foreign-owned infrastructure play.

  The press release does not distinguish between Midrand and CPT1 for GPU allocation — both SA
  facilities are part of the NCP deployment.

  Africa Data Centres partnered with Oni-Tel Fibre Networks to enhance connectivity at the
  Midrand and Samrand campuses via Oni-Tel's "Infinity" fibre interconnection platform,
  adding dark fibre and carrier-neutral options for Gauteng customers. The announcement
  cites enterprise demand for cloud adoption, AI deployment, and data-intensive workloads
  as the driver, though no specific bandwidth or capacity figures are given.

  **Capacity:** Not stated in source — requires a primary source (ADC press releases, company filings).
