notes: |
  This record covers Teraco's Isando campus, not a single JB1 building. The 2023
  technical sheet in `data/sources/2023-Teraco-Tech-Spec-Isando-Campus.pdf` is titled
  "JB1 + JB3 Isando Campus"; Teraco's current Johannesburg page presents the Isando
  campus as JB1 + JB3 + JB5.

  The technical sheet reports 45,000 square meters of total space, 20,000 square
  meters of white space, 80MVA total power, and 40MVA available IT power load across
  the data centre footprint. Because the schema has MW fields but no MVA fields, the
  power figures are recorded as MW-equivalent with notes.

  Cloud on-ramps and provider names are treated as connectivity/ecosystem evidence,
  not as proof that the named cloud providers are tenants in this facility.
