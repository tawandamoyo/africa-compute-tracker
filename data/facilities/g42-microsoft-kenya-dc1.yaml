status_history:
  - status: announced
    date: "2024-05-22"
    note: >-
      Microsoft and G42 announced the broader Kenya digital initiative and said
      that a letter of intent with Kenya's Ministry of Information,
      Communications and the Digital Economy would be signed on 24 May 2024.
  - status: paused
    date: "2026-05-06"
    note: >-
      Trade reporting said the original project had stalled after its concept
      note failed to receive Kenyan Treasury clearance, the May 2026 target was
      missed, and talks over government capacity-payment guarantees broke down.
      Kenyan officials subsequently denied that the project had been withdrawn
      and said discussions could continue, potentially at a smaller scale.

