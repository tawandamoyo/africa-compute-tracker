notes: |
  This record replaces the provisional `cavaleros-cape-town-dc1` identity. Cavaleros'
  operator statement identifies the project as the CDC Cape Town campus, part of the
  Cosmas Data City campus programme.

  The operator statement describes CDC Cape Town as a 100-hectare development with over
  360MVA of power availability. Daily Maverick reports the Cape Town project as 360MW
  and places it within a broader set of four Cape Town data-centre developments totalling
  580MW of reported demand.

  The Microsoft link remains unconfirmed. Do not cite Microsoft as a tenant or anchor
  customer unless a primary source confirms it.

  The Cavaleros LinkedIn evidence is also preserved as a local text snapshot in
  `data/sources/2026-Cavaleros-Cosmas-Data-City-LinkedIn.md` because social posts can
  be difficult to retrieve reproducibly.
