notes: |
  Vantage Data Centers is building a facility at Waterfall City, a large mixed-use development
  in Midrand, Gauteng. The company has secured 87MW of power from SolarAfrica under a
  power purchase agreement.

  Vantage is a US-headquartered hyperscale data centre developer with campuses across North
  America, Europe, and Asia Pacific. The Waterfall City site represents its South African entry.

  Waterfall City sits in the Midrand corridor between Johannesburg and Pretoria — the same
  general zone as the ADC Midrand campus and within the Ekurhuleni/Midrand industrial belt.
