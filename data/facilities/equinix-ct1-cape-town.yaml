notes: |
  Equinix CT1 (formerly Teraco CT1) is the established carrier-neutral colocation campus in Cape
  Town, part of the five-site Teraco portfolio acquired by Equinix in June 2022 for approximately
  USD 1.625 billion.

  A 60MW expansion was announced for this site. The source article refers to the operator as
  "Teraco" — this language may predate the acquisition closing or reflect continued Teraco brand
  use under Equinix ownership.

  This 60MW expansion is one of four new Cape Town projects totalling 580MW described in the
  source article (Cavaleros 360MW + Teraco/Equinix CT1 60MW expansion + Equinix two new sites
  160MW combined).

  **Existing capacity:** Not stated in source — the 60MW in the capacity field refers to the
  expansion only. Full operational capacity requires a separate primary source.

  **Source URL:** The source URL in this record is a placeholder — replace with the actual article
  URL when identified.
